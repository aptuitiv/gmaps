# Runs the test suite and the linter on pushes and pull requests.
#
# The build deliberately does not run the linter any more (it doubled the build time and
# rewrote source files through the eslint plugin's "fix" option), so this is where linting
# happens now.

name: Test

on:
    push:
        branches: ["develop", "main"]
        paths-ignore: ["docs/**", "site-src/**", "ai-plans/**", "**/*.md"]

    pull_request:
        branches: ["develop", "main"]
        paths-ignore: ["docs/**", "site-src/**", "ai-plans/**", "**/*.md"]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

concurrency:
    group: "test-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Lint
              run: npx eslint ./src
